<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IELTS Cambridge Prep & Vocabulary Master</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Fonts: Plus Jakarta Sans & Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Hind Siliguri', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Hide scrollbar for clean app feel */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .view-screen { transition: opacity 0.2s ease-in-out; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Mobile App Frame Container (Desktop e Center Frame, Mobile e Fullscreen) -->
  <div class="w-full max-w-[430px] bg-slate-50 h-screen sm:h-[880px] sm:rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col justify-between border-0 sm:border-[8px] sm:border-slate-800">

    <!-- Phone Top Status Bar Mockup -->
    <div class="px-6 pt-3 pb-1 flex justify-between items-center text-xs font-semibold text-slate-700 bg-white z-30 shrink-0 select-none">
      <span>09:41</span>
      <div class="w-20 h-4 bg-slate-900 rounded-full mx-auto hidden sm:block"></div>
      <div class="flex items-center gap-1.5 text-slate-800">
        <i class="fa-solid fa-signal text-[10px]"></i>
        <i class="fa-solid fa-wifi text-[10px]"></i>
        <i class="fa-solid fa-battery-full text-[12px]"></i>
      </div>
    </div>

    <!-- App Views Container -->
    <div class="relative flex-1 overflow-hidden flex flex-col">

      <!-- ================= 1. HOME VIEW ================= -->
      <div id="viewHome" class="view-screen w-full h-full flex flex-col flex-1 overflow-y-auto no-scrollbar">
        <!-- Top Profile Bar -->
        <header class="px-5 py-3.5 bg-white border-b border-slate-100 flex items-center justify-between sticky top-0 z-20 shadow-sm">
          <div class="flex items-center gap-3">
            <div class="relative">
              <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold flex items-center justify-center text-sm shadow-md ring-2 ring-blue-500/20">
                TA
              </div>
              <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></span>
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <h2 class="text-sm font-extrabold text-slate-900">Tanbir Ahmed</h2>
                <span class="bg-blue-100 text-blue-700 text-[10px] font-bold px-1.5 py-0.5 rounded-md">IELTS</span>
              </div>
              <p class="text-xs font-medium text-slate-400">Target Band: 8.0</p>
            </div>
          </div>
          <button onclick="showToast('কোনো নতুন নোটিফিকেশন নেই')" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors relative">
            <i class="fa-regular fa-bell text-base"></i>
            <span class="absolute top-2.5 right-2.5 w-2 h-2 bg-rose-500 rounded-full"></span>
          </button>
        </header>

        <!-- Main Home Content -->
        <main class="p-5 space-y-6 pb-28">
          <!-- Hero Banner -->
          <section class="relative rounded-3xl overflow-hidden bg-gradient-to-br from-blue-700 via-indigo-600 to-sky-500 text-white p-6 shadow-xl shadow-blue-500/25">
            <div class="relative z-10 space-y-2.5">
              <span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[10px] font-extrabold tracking-wider uppercase">IELTS Masterclass</span>
              <h1 class="text-2xl font-black leading-tight">ক্যামব্রিজ ১০-১৯ ভোকাভিউ ও সলিউশন</h1>
              <p class="text-xs text-blue-100/90 font-medium">মডিউল সিলেক্ট করে আপনার প্রতিদিনের প্রস্তুতি শুরু করুন।</p>
            </div>
          </section>

          <!-- 4 Core Modules (2x2 Grid) -->
          <section class="space-y-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">প্রধান মডিউলসমূহ</h3>
            <div class="grid grid-cols-2 gap-3.5">
              <!-- Reading Card -->
              <button onclick="openCambridgeList('Reading')" class="p-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-emerald-500/50 transition-all text-left flex flex-col justify-between h-36 active:scale-95 group">
                <div class="w-11 h-11 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl group-hover:bg-emerald-500 group-hover:text-white transition-all shadow-sm">
                  <i class="fa-solid fa-book-open-reader"></i>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 text-base">Reading</h4>
                  <p class="text-xs text-slate-400 font-medium">Cambridge 10-19</p>
                </div>
              </button>

              <!-- Listening Card -->
              <button onclick="openCambridgeList('Listening')" class="p-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-blue-500/50 transition-all text-left flex flex-col justify-between h-36 active:scale-95 group">
                <div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:bg-blue-500 group-hover:text-white transition-all shadow-sm">
                  <i class="fa-solid fa-headphones"></i>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 text-base">Listening</h4>
                  <p class="text-xs text-slate-400 font-medium">Cambridge 10-19</p>
                </div>
              </button>

              <!-- Writing Card -->
              <button onclick="openCambridgeList('Writing')" class="p-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-amber-500/50 transition-all text-left flex flex-col justify-between h-36 active:scale-95 group">
                <div class="w-11 h-11 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl group-hover:bg-amber-500 group-hover:text-white transition-all shadow-sm">
                  <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 text-base">Writing</h4>
                  <p class="text-xs text-slate-400 font-medium">Task 1 & Task 2</p>
                </div>
              </button>

              <!-- Speaking Card -->
              <button onclick="openCambridgeList('Speaking')" class="p-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:border-rose-500/50 transition-all text-left flex flex-col justify-between h-36 active:scale-95 group">
                <div class="w-11 h-11 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl group-hover:bg-rose-500 group-hover:text-white transition-all shadow-sm">
                  <i class="fa-solid fa-microphone-lines"></i>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 text-base">Speaking</h4>
                  <p class="text-xs text-slate-400 font-medium">Cue Cards & Q/A</p>
                </div>
              </button>
            </div>
          </section>
        </main>
      </div>

      <!-- ================= 2. CAMBRIDGE BOOKS GRID VIEW ================= -->
      <div id="viewCambridgeList" class="view-screen w-full h-full hidden flex-col flex-1 overflow-y-auto no-scrollbar bg-slate-50">
        <header class="px-5 py-4 bg-white border-b border-slate-200 flex items-center gap-3 sticky top-0 z-20 shadow-sm">
          <button onclick="showView('viewHome')" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors">
            <i class="fa-solid fa-chevron-left text-sm"></i>
          </button>
          <div>
            <h2 id="moduleTitleHeader" class="text-base font-extrabold text-slate-800">Reading Module</h2>
            <p class="text-[11px] font-medium text-slate-400">Cambridge Books 10 to 19</p>
          </div>
        </header>

        <main class="p-5 pb-28 flex-1">
          <p class="text-xs font-bold text-slate-500 mb-3 uppercase tracking-wider">বই নির্বাচন করুন</p>
          <div class="grid grid-cols-2 gap-3.5">
            <!-- 10 to 19 Books Generated -->
            <button onclick="openBookDetails('Cambridge 10')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">10</span>
            </button>
            <button onclick="openBookDetails('Cambridge 11')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">11</span>
            </button>
            <button onclick="openBookDetails('Cambridge 12')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">12</span>
            </button>
            <button onclick="openBookDetails('Cambridge 13')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">13</span>
            </button>
            <button onclick="openBookDetails('Cambridge 14')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">14</span>
            </button>
            <button onclick="openBookDetails('Cambridge 15')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">15</span>
            </button>
            <button onclick="openBookDetails('Cambridge 16')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">16</span>
            </button>
            <button onclick="openBookDetails('Cambridge 17')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">17</span>
            </button>
            <button onclick="openBookDetails('Cambridge 18')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">18</span>
            </button>
            <button onclick="openBookDetails('Cambridge 19')" class="bg-white hover:bg-blue-50/50 p-4 rounded-2xl border border-slate-200 hover:border-blue-500 shadow-sm transition-all text-center flex flex-col items-center justify-center h-28 group active:scale-95">
              <span class="text-[11px] font-bold text-slate-400 group-hover:text-blue-500 uppercase">Cambridge</span>
              <span class="text-2xl font-black text-slate-800 group-hover:text-blue-600 mt-1">19</span>
            </button>
          </div>
        </main>
      </div>

      <!-- ================= 3. WORDS & SYNONYM DETAILS VIEW ================= -->
      <div id="viewBookDetails" class="view-screen w-full h-full hidden flex-col flex-1 bg-slate-100 overflow-hidden">
        <header class="px-5 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between sticky top-0 z-20 shadow-sm shrink-0">
          <div class="flex items-center gap-3">
            <button onclick="showView('viewCambridgeList')" class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition-colors">
              <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <h2 id="selectedBookHeader" class="text-base font-black text-slate-800">Cambridge 10</h2>
          </div>
          <span id="activeTestBadge" class="px-2.5 py-1 bg-blue-100 text-blue-700 font-bold text-xs rounded-lg">Test 1</span>
        </header>

        <!-- Scrollable Word Cards -->
        <main id="wordsContainer" class="p-4 space-y-4 overflow-y-auto no-scrollbar flex-1 pb-36">
          <!-- Rendered dynamically by JS -->
        </main>

        <!-- T1 - T4 Sticky Test Selector -->
        <div class="absolute bottom-[66px] inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200 p-2.5 z-20 shadow-lg">
          <div class="grid grid-cols-4 gap-2 max-w-sm mx-auto">
            <button onclick="selectTest('T1')" id="btnT1" class="test-btn py-2 text-xs font-bold rounded-xl border border-blue-600 bg-blue-600 text-white transition-all shadow-sm">T1</button>
            <button onclick="selectTest('T2')" id="btnT2" class="test-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all">T2</button>
            <button onclick="selectTest('T3')" id="btnT3" class="test-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all">T3</button>
            <button onclick="selectTest('T4')" id="btnT4" class="test-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all">T4</button>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= FIXED BOTTOM NAVBAR ================= -->
    <nav class="shrink-0 bg-white border-t border-slate-200 px-2 py-1.5 z-30 relative select-none">
      <div class="grid grid-cols-5 items-center justify-items-center w-full max-w-md mx-auto">
        <button onclick="showView('viewHome')" class="nav-btn flex flex-col items-center justify-center w-full py-1 text-blue-600 transition-all">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="text-[10px] font-bold mt-0.5">হোম</span>
        </button>

        <button onclick="showToast('খুঁজতে শব্দ বা টেস্টের নাম লিখুন')" class="nav-btn flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition-all">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
          <span class="text-[10px] font-medium mt-0.5">সার্চ</span>
        </button>

        <!-- Center Plus Action Button -->
        <button onclick="openPostModal()" class="flex flex-col items-center justify-center w-full group focus:outline-none">
          <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-600 text-white flex items-center justify-center text-xl shadow-lg shadow-blue-500/35 border-2 border-white -mt-6 transition-transform group-hover:scale-105 active:scale-95">
            <i class="fa-solid fa-plus"></i>
          </div>
          <span class="text-[10px] font-semibold mt-0.5 text-slate-600">পোস্ট</span>
        </button>

        <button onclick="showToast('প্রোগ্রেস অ্যানালিটিক্স লোড হচ্ছে...')" class="nav-btn flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition-all">
          <i class="fa-solid fa-chart-column text-lg"></i>
          <span class="text-[10px] font-medium mt-0.5">প্রোগ্রেস</span>
        </button>

        <button onclick="showToast('প্রোফাইল সেটিংস ও সাবস্ক্রিপশন')" class="nav-btn flex flex-col items-center justify-center w-full py-1 text-slate-400 hover:text-slate-600 transition-all">
          <i class="fa-solid fa-user text-lg"></i>
          <span class="text-[10px] font-medium mt-0.5">প্রোফাইল</span>
        </button>
      </div>
    </nav>

    <!-- ================= ADD NEW WORD MODAL ================= -->
    <div id="postModal" class="hidden absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
      <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
        <div class="flex items-center justify-between border-b pb-3 border-slate-100">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-sm font-bold">
              <i class="fa-solid fa-pen"></i>
            </div>
            <h3 class="text-base font-extrabold text-slate-800">নতুন শব্দ পোস্ট করুন</h3>
          </div>
          <button onclick="closePostModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center hover:bg-slate-200">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <form onsubmit="handlePostSubmit(event)" class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Word (ইংরেজি শব্দ)</label>
            <input type="text" id="inputWord" required placeholder="e.g. Cautiously" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Bangla Meaning (বাংলা অর্থ)</label>
            <input type="text" id="inputMeaning" required placeholder="e.g. সতর্কতার সাথে" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Cambridge Book</label>
              <select id="inputBook" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                <option>Cambridge 10</option>
                <option>Cambridge 11</option>
                <option>Cambridge 12</option>
                <option>Cambridge 13</option>
                <option>Cambridge 14</option>
                <option>Cambridge 15</option>
                <option>Cambridge 16</option>
                <option>Cambridge 17</option>
                <option>Cambridge 18</option>
                <option>Cambridge 19</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Test Number</label>
              <select id="inputTest" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                <option value="T1">Test 1 (T1)</option>
                <option value="T2">Test 2 (T2)</option>
                <option value="T3">Test 3 (T3)</option>
                <option value="T4">Test 4 (T4)</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Synonyms (কমা দিয়ে লিখুন)</label>
            <input type="text" id="inputSynonyms" placeholder="Carefully + সাবধানতার সাথে, Prudently" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Antonyms (কমা দিয়ে লিখুন)</label>
            <input type="text" id="inputAntonyms" placeholder="Carelessly + অসাবধানতাবশত, Rashly" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>

          <div class="pt-2 flex gap-2">
            <button type="button" onclick="closePostModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-xl hover:bg-slate-200">
              বাতিল
            </button>
            <button type="submit" class="flex-1 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20">
              পোস্ট করুন
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden absolute top-12 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-xl z-50">
      বিজ্ঞপ্তি
    </div>

  </div>

  <!-- Client-side Logic & Data Engine -->
  <script>
    let currentModule = 'Reading';
    let currentBook = 'Cambridge 10';
    let currentTest = 'T1';

    // Local Storage or Pre-loaded Words Database
    const initialVocabulary = [
      {
        book: "Cambridge 10",
        test: "T1",
        word: "Cautiously",
        meaning: "সতর্কতার সাথে / সাবধানতার সাথে",
        synonyms: [
          "Carefully + সাবধানতার সাথে",
          "Prudently + বিচক্ষণতার সাথে",
          "Warily + সতর্কভাবে"
        ],
        antonyms: [
          "Carelessly + অসাবধানতাবশত",
          "Recklessly + বেপরোয়াভাবে",
          "Rashly + হুড়মুড় করে"
        ]
      },
      {
        book: "Cambridge 10",
        test: "T1",
        word: "Prevailed",
        meaning: "জয়ী হওয়া / বিদ্যমান থাকা",
        synonyms: [
          "Triumphed + জয়লাভ করেছিল",
          "Succeeded + সফল হয়েছিল",
          "Predominated + আধিপত্য বিস্তার করেছিল"
        ],
        antonyms: [
          "Failed + ব্যর্থ হয়েছিল",
          "Surrendered + আত্মসমর্পণ করেছিল",
          "Yielded + নতি স্বীকার করেছিল"
        ]
      },
      {
        book: "Cambridge 10",
        test: "T2",
        word: "Reluctant",
        meaning: "অনিচ্ছুক / দ্বিধাগ্রস্ত",
        synonyms: [
          "Unwilling + অনিচ্ছুক",
          "Hesitant + দ্বিধাগ্রস্ত",
          "Disinclined + অপছন্দকারী"
        ],
        antonyms: [
          "Eager + আগ্রহী",
          "Willing + ইচ্ছুক",
          "Enthusiastic + উৎফুল্ল"
        ]
      }
    ];

    let vocabularyDB = JSON.parse(localStorage.getItem('user_vocab_db')) || initialVocabulary;

    function showView(viewId) {
      document.getElementById('viewHome').classList.add('hidden');
      document.getElementById('viewCambridgeList').classList.add('hidden');
      document.getElementById('viewBookDetails').classList.add('hidden');

      const target = document.getElementById(viewId);
      target.classList.remove('hidden');
      target.classList.add('flex');
    }

    function openCambridgeList(moduleName) {
      currentModule = moduleName;
      document.getElementById('moduleTitleHeader').innerText = moduleName + " Module";
      showView('viewCambridgeList');
    }

    function openBookDetails(bookName) {
      currentBook = bookName;
      document.getElementById('selectedBookHeader').innerText = bookName;
      renderWords();
      showView('viewBookDetails');
    }

    function selectTest(testId) {
      currentTest = testId;
      document.getElementById('activeTestBadge').innerText = "Test " + testId.replace('T', '');
      
      ['T1', 'T2', 'T3', 'T4'].forEach(t => {
        const btn = document.getElementById('btn' + t);
        if (t === testId) {
          btn.className = "test-btn py-2 text-xs font-bold rounded-xl border border-blue-600 bg-blue-600 text-white transition-all shadow-md";
        } else {
          btn.className = "test-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 transition-all";
        }
      });

      renderWords();
    }

    function renderWords() {
      const container = document.getElementById('wordsContainer');
      container.innerHTML = '';

      const filtered = vocabularyDB.filter(item => item.book === currentBook && item.test === currentTest);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center space-y-2 border border-slate-200 my-4 shadow-sm">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300"></i>
            <p class="text-xs font-bold text-slate-700">${currentBook} (${currentTest}) এর জন্য কোনো শব্দ পাওয়া যায়নি</p>
            <p class="text-[11px] text-slate-400">নিচের '+' আইকনে ট্যাপ করে নতুন শব্দ যুক্ত করুন।</p>
          </div>
        `;
        return;
      }

      filtered.forEach(data => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200/90 p-4 shadow-sm space-y-3";

        const synHTML = data.synonyms.map(s => `<li class="text-[11px] text-slate-600 font-medium leading-relaxed">${s}</li>`).join('');
        const antHTML = data.antonyms.map(a => `<li class="text-[11px] text-slate-600 font-medium leading-relaxed">${a}</li>`).join('');

        card.innerHTML = `
          <div class="border-b border-slate-100 pb-2.5">
            <h3 class="text-sm font-extrabold text-slate-800">
              Word: <span class="text-blue-600">${data.word}</span> — <span class="text-emerald-700 font-bold">${data.meaning}</span>
            </h3>
          </div>
          <div class="grid grid-cols-2 gap-3 pt-0.5">
            <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100">
              <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 border-b border-slate-200 pb-1">Synonym:</h4>
              <ul class="space-y-1 list-disc list-inside text-slate-700">
                ${synHTML || '<li class="text-[10px] text-slate-400">নেই</li>'}
              </ul>
            </div>
            <div class="bg-slate-50/80 p-2.5 rounded-xl border border-slate-100">
              <h4 class="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1.5 border-b border-slate-200 pb-1">Antonym:</h4>
              <ul class="space-y-1 list-disc list-inside text-slate-700">
                ${antHTML || '<li class="text-[10px] text-slate-400">নেই</li>'}
              </ul>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openPostModal() {
      document.getElementById('postModal').classList.remove('hidden');
    }

    function closePostModal() {
      document.getElementById('postModal').classList.add('hidden');
    }

    function handlePostSubmit(e) {
      e.preventDefault();
      const word = document.getElementById('inputWord').value.trim();
      const meaning = document.getElementById('inputMeaning').value.trim();
      const book = document.getElementById('inputBook').value;
      const test = document.getElementById('inputTest').value;
      const synonymsInput = document.getElementById('inputSynonyms').value.trim();
      const antonymsInput = document.getElementById('inputAntonyms').value.trim();

      const synonyms = synonymsInput ? synonymsInput.split(',').map(s => s.trim()) : [];
      const antonyms = antonymsInput ? antonymsInput.split(',').map(a => a.trim()) : [];

      vocabularyDB.unshift({ book, test, word, meaning, synonyms, antonyms });
      localStorage.setItem('user_vocab_db', JSON.stringify(vocabularyDB));

      closePostModal();
      showToast('নতুন শব্দ সফলভাবে পোস্ট করা হয়েছে!');

      if (currentBook === book && currentTest === test) {
        renderWords();
      } else {
        openBookDetails(book);
        selectTest(test);
      }
      e.target.reset();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => { toast.classList.add('hidden'); }, 2200);
    }

    // Default startup
    window.onload = function() {
      selectTest('T1');
    };
  </script>
</body>
</html>
