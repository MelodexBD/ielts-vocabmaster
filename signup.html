<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up / Sign In - IELTS Vocab Master</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrapper {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .auth-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: block;
      margin-bottom: 6px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
      box-sizing: border-box;
    }
    .input-field:focus {
      border-color: var(--accent);
    }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <a href="index.html" class="brand-title">IELTS <span>VocabMaster</span></a>
    <button class="theme-toggle" id="themeBtn">🌓 Theme</button>
  </header>

  <div class="auth-wrapper">
    <div class="auth-box">
      <!-- Tabs for Login / Signup -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabSignup" onclick="switchAuth('signup')">Create Account</button>
        <button class="auth-tab" id="tabLogin" onclick="switchAuth('login')">Sign In</button>
      </div>

      <!-- Signup Form -->
      <form id="signupForm" onsubmit="handleSignup(event)">
        <div>
          <label class="form-label">Full Name</label>
          <input type="text" id="signupName" class="input-field" placeholder="Enter your full name" required>
        </div>
        <div>
          <label class="form-label">Email Address</label>
          <input type="email" id="signupEmail" class="input-field" placeholder="name@example.com" required>
        </div>
        <div>
          <label class="form-label">Password</label>
          <input type="password" id="signupPassword" class="input-field" placeholder="Minimum 6 characters" minlength="6" required>
        </div>
        <div>
          <label class="form-label">Confirm Password</label>
          <input type="password" id="signupConfirmPassword" class="input-field" placeholder="Re-enter your password" minlength="6" required>
          <div id="passwordError" class="error-msg">Passwords do not match!</div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Create Free Account</button>
      </form>

      <!-- Sign In Form -->
      <form id="loginForm" style="display: none;" onsubmit="handleLogin(event)">
        <div>
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="input-field" placeholder="name@example.com" required>
        </div>
        <div>
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="input-field" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">Sign In to Dashboard</button>
      </form>

      <div style="text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 13px;">OR</div>

      <button type="button" class="btn btn-outline" style="width: 100%; padding: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;" onclick="window.location.href='dashboard.html'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Continue with Google
      </button>
    </div>
  </div>

  <script>
    // Theme Switcher
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Toggle between Signup and Login Tabs
    function switchAuth(type) {
      const errorMsg = document.getElementById('passwordError');
      errorMsg.style.display = 'none';

      if(type === 'signup') {
        document.getElementById('signupForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('tabSignup').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
      } else {
        document.getElementById('signupForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('tabSignup').classList.remove('active');
        document.getElementById('tabLogin').classList.add('active');
      }
    }

    // Signup Validation (Password Match Check)
    function handleSignup(e) {
      e.preventDefault();
      const pass = document.getElementById('signupPassword').value;
      const confirmPass = document.getElementById('signupConfirmPassword').value;
      const errorMsg = document.getElementById('passwordError');

      if (pass !== confirmPass) {
        errorMsg.style.display = 'block';
        return;
      }

      errorMsg.style.display = 'none';
      // প্রথমবার সাইন-আপ শেষ হলে সরাসরি Profile Setup পেজে নিয়ে যাবে
      window.location.href = 'profile-setup.html';
    }

    // Login Submission
    function handleLogin(e) {
      e.preventDefault();
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
